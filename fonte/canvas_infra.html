/* ================= exportar / importar ================= */
async function exportar(){
  const dados = JSON.stringify({formato: 'canvas-bl-backup', versao: 1, exportadoEm: new Date().toISOString(), quadros}, null, 2);
  if (dl){
    try { await dl.save({filename: 'canvas-infraestrutura-backup.json', data: dados}); toast('Backup exportado'); return; }
    catch (e){ if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(dados); toast('Não deu pra baixar aqui. O backup foi copiado pra área de transferência.'); }
  catch (e){ toast('Não deu pra exportar neste aparelho.'); }
}
$('#arquivo').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || ro()) return;
  let o = null;
  try { o = JSON.parse(await f.text()); } catch(err){ toast('Esse arquivo não é um backup válido.'); return; }
  if (!o || o.formato !== 'canvas-bl-backup' || typeof o.quadros !== 'object'){ toast('Esse arquivo não é um backup deste canvas.'); return; }
  const ok = await confirmar({titulo: 'Importar backup?', texto: 'Todos os quadros atuais vão ser trocados pelos do arquivo. Isso não pode ser desfeito.', ok: 'Importar'});
  if (!ok) return;
  Object.keys(quadros).forEach(id => { if (!o.quadros[id]){ delete quadros[id]; agendarSalvar(id); } });
  Object.keys(o.quadros).forEach(id => { quadros[id] = normalizar(o.quadros[id]); agendarSalvar(id); });
  Object.keys(hist).forEach(k => delete hist[k]);
  Q = null;
  entrarNoQuadro('raiz');
  toast('Backup importado');
});

/* ================= busca (Ctrl+F) ================= */
const normalizar_ = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function textoDoNo(n){
  return [n.titulo, n.subtitulo, n.texto, n.rotuloTipo, (n.etiquetas || []).join(' '), n.nota, n.tipo === 'diagrama' && diag(n.diagramaId) ? diag(n.diagramaId).nome + ' ' + diag(n.diagramaId).formato : '',
          (n.topicos || []).map(t => (t.texto || '') + ' ' + (t.nota || '')).join(' '),
          n.tipo === 'quadro' && quadros[n.quadroId] ? quadros[n.quadroId].nome : ''].join(' \n ');
}
function abrirBusca(){
  const b = $('#busca'); b.hidden = false;
  const inp = $('#busca-in'); inp.focus(); inp.select();
  if (inp.value.trim()) buscar(false);
}
function fecharBusca(){
  $('#busca').hidden = true; achados = new Set(); buscaRes = []; buscaI = -1;
  render(); vp.focus();
}
function mostrarContagem(){
  const el = $('#busca-n'), q = $('#busca-in').value.trim();
  el.classList.toggle('nada', !!q && !buscaRes.length);
  el.textContent = !q ? '' : (buscaRes.length ? (buscaI + 1) + ' de ' + buscaRes.length : 'Nenhum');
  $('#busca-ant').disabled = buscaRes.length < 2; $('#busca-prox').disabled = buscaRes.length < 2;
}
function buscar(viajar){
  const q = normalizar_($('#busca-in').value.trim());
  const atual = buscaRes[buscaI];
  if (!q){ buscaRes = []; buscaI = -1; achados = new Set(); mostrarContagem(); render(); return; }
  buscaRes = Q.nodes.filter(n => normalizar_(textoDoNo(n)).includes(q))
    .sort((a, b) => (a.y - b.y) || (a.x - b.x)).map(n => n.id);
  achados = new Set(buscaRes);
  const k = buscaRes.indexOf(atual);
  buscaI = buscaRes.length ? (k >= 0 ? k : 0) : -1;
  mostrarContagem(); render();
  clearTimeout(timerBusca);
  if (viajar !== false && buscaI >= 0) timerBusca = setTimeout(() => irParaAchado(), 260);
}
function passoBusca(d){
  if (!buscaRes.length) return;
  buscaI = (buscaI + d + buscaRes.length) % buscaRes.length;
  mostrarContagem(); irParaAchado();
}
function irParaAchado(){
  const n = no(buscaRes[buscaI]); if (!n) return;
  sel = new Set([n.id]); render(); renderPainel();
  const s = tam(n), r = vp.getBoundingClientRect();
  const k = clamp(Math.min(1.15, (r.width * 0.55) / Math.max(s.w, 1), (r.height * 0.55) / Math.max(s.h, 1)), 0.12, 1.4);
  const alvo = {k, x: r.width / 2 - (n.x + s.w / 2) * k, y: r.height / 2 - (n.y + s.h / 2) * k};
  viajarPara(alvo);
}
function viajarPara(alvo){
  cancelAnimationFrame(animVista);
  const ini = {x: view.x, y: view.y, k: view.k};
  const reduz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduz ? 0 : 520, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const passo = agora => {
    const t = dur ? Math.min(1, (agora - t0) / dur) : 1, e = ease(t);
    // zoom interpolado em escala logarítmica pra não "pular"
    const k = Math.exp(Math.log(ini.k) + (Math.log(alvo.k) - Math.log(ini.k)) * e);
    const cx0 = (vp.clientWidth / 2 - ini.x) / ini.k, cy0 = (vp.clientHeight / 2 - ini.y) / ini.k;
    const cx1 = (vp.clientWidth / 2 - alvo.x) / alvo.k, cy1 = (vp.clientHeight / 2 - alvo.y) / alvo.k;
    const cx = cx0 + (cx1 - cx0) * e, cy = cy0 + (cy1 - cy0) * e;
    view.k = k; view.x = vp.clientWidth / 2 - cx * k; view.y = vp.clientHeight / 2 - cy * k;
    aplicarView();
    if (t < 1) animVista = requestAnimationFrame(passo);
  };
  animVista = requestAnimationFrame(passo);
}
$('#busca-in').addEventListener('input', () => buscar(true));
$('#busca-in').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'ArrowDown'){ e.preventDefault(); passoBusca(e.shiftKey && e.key === 'Enter' ? -1 : 1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); passoBusca(-1); }
  else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); fecharBusca(); }
});
$('#busca-ant').addEventListener('click', () => passoBusca(-1));
$('#busca-prox').addEventListener('click', () => passoBusca(1));
$('#busca-x').addEventListener('click', fecharBusca);

/* ================= teclado ================= */
let nudgeT = 0;
function empurrar(dx, dy, repetindo){
  const ids = [...sel].filter(id => no(id)); if (!ids.length || ro()) return;
  if (!repetindo || Date.now() - nudgeT > 900) antes();
  nudgeT = Date.now();
  ids.forEach(id => { const n = no(id); n.x += dx; n.y += dy; });
  agendarSalvar(atualId); render();
}
document.addEventListener('keydown', e => {
  if (!modal.hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); if (editando) encerrarEdicao(true); fecharMenu(); abrirBusca(); return; }
  if (editando && editando.el.contains(e.target)){ teclaEdicao(e); return; }
  if (e.key === 'Escape'){
    if (!menu.hidden){ fecharMenu(); return; }
    if (!$('#busca').hidden && !emCampo(e.target)){ fecharBusca(); return; }
    if (!pop.hidden){ fecharPop(); return; }
    if (emCampo(e.target)){ e.target.blur(); vp.focus(); return; }
    if (sel.size){ sel.clear(); render(); renderPainel(); }
    return;
  }
  if (emCampo(e.target)) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); fecharMenu(); if (e.shiftKey) refazer(); else desfazer(); return; }
  if (mod && k === 'y'){ e.preventDefault(); fecharMenu(); refazer(); return; }
  if (!menu.hidden && menu.contains(e.target)) return;
  if (painel.contains(e.target)) return;
  if (e.code === 'Space'){ espaco = true; if (e.target === vp || e.target === document.body) e.preventDefault(); return; }
  if (mod && k === 'z'){ e.preventDefault(); if (e.shiftKey) refazer(); else desfazer(); return; }
  if (mod && k === 'y'){ e.preventDefault(); refazer(); return; }
  if (mod && k === 'a'){ e.preventDefault(); selecionarTudo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicar(); return; }
  if (!mod && (e.key === 'Delete' || e.key === 'Backspace')){ e.preventDefault(); excluirSel(); return; }
  if (!mod && e.key === 'F2'){ const ids = [...sel]; if (ids.length === 1 && no(ids[0])){ e.preventDefault(); editarTitulo(no(ids[0])); } return; }
  if (e.shiftKey && (e.code === 'Digit1' || e.key === '!')){ e.preventDefault(); enquadrar(); return; }
  if (!mod && e.key === '?'){ mostrarAtalhos(); return; }
  if (!mod && (e.key === 's' || e.key === 'S')){ alternarModoSel(); return; }
  const passo = e.shiftKey ? GRADE : 1;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); empurrar(-passo, 0, e.repeat); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); empurrar(passo, 0, e.repeat); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); empurrar(0, -passo, e.repeat); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); empurrar(0, passo, e.repeat); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') espaco = false; });
window.addEventListener('blur', () => { espaco = false; });
painel.addEventListener('focusout', () => setTimeout(aplicarRemotoPendente, 0));

/* ================= minimapa ================= */
let miniMapa = null;
function agendarMini(){ if (rafMini) return; rafMini = requestAnimationFrame(() => { rafMini = 0; desenharMini(); }); }
function desenharMini(){
  if (!cfg.minimapa || !Q || getComputedStyle(mini).display === 'none') return;
  const W = 180, H = 120, dpr = window.devicePixelRatio || 1;
  if (mini.width !== W * dpr){ mini.width = W * dpr; mini.height = H * dpr; }
  const g = mini.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const r = vp.getBoundingClientRect();
  const v0 = mundoDe(r.left, r.top), v1 = mundoDe(r.right, r.bottom);
  let a = v0.x, b = v0.y, c = v1.x, d = v1.y;
  const tamanhos = Q.nodes.map(n => { const s = tam(n); a = Math.min(a, n.x); b = Math.min(b, n.y); c = Math.max(c, n.x + s.w); d = Math.max(d, n.y + s.h); return s; });
  const pad = 40; a -= pad; b -= pad; c += pad; d += pad;
  const s = Math.min((W - 12) / (c - a), (H - 12) / (d - b));
  const ox = (W - (c - a) * s) / 2 - a * s, oy = (H - (d - b) * s) / 2 - b * s;
  miniMapa = {s, ox, oy};
  Q.nodes.forEach((n, i) => {
    const t = tamanhos[i], hex = corHex(n.cor);
    const x = n.x * s + ox, y = n.y * s + oy, w = Math.max(2, t.w * s), h = Math.max(2, t.h * s);
    if (n.tipo === 'grupo'){ g.strokeStyle = hex; g.globalAlpha = .7; g.lineWidth = 1; g.strokeRect(x, y, w, h); }
    else { g.fillStyle = sel.has(n.id) ? COR_SEL : hex; g.globalAlpha = n.tipo === 'texto' ? .45 : .8; g.fillRect(x, y, w, h); }
  });
  g.globalAlpha = 1; g.strokeStyle = '#FF6B6F'; g.lineWidth = 1.2;
  g.strokeRect(v0.x * s + ox, v0.y * s + oy, (v1.x - v0.x) * s, (v1.y - v0.y) * s);
}
function irMini(e){
  if (!miniMapa) return;
  const rr = mini.getBoundingClientRect();
  const wx = (e.clientX - rr.left - miniMapa.ox) / miniMapa.s, wy = (e.clientY - rr.top - miniMapa.oy) / miniMapa.s;
  const r = vp.getBoundingClientRect();
  view.x = r.width / 2 - wx * view.k; view.y = r.height / 2 - wy * view.k;
  aplicarView();
}
mini.addEventListener('pointerdown', e => {
  e.preventDefault(); irMini(e);
  acao = {mover: irMini, soltar(){}, cancelar(){}};
});

/* ================= barra de ferramentas ================= */
function montarBarra(){
  let h = ORDEM_CRIAR.map(t => '<button class="bb" data-criar="' + t + '" title="' + esc(TIPOS[t].nome) + '" aria-label="' + esc(TIPOS[t].nome) + '">' + ico(TIPOS[t].icone) + '</button>').join('');
  h += '<span class="bsep"></span>';
  h += '<button class="bb" id="b-sel" title="Selecionar área: arraste no fundo pra selecionar, depois arraste a moldura pra mover tudo (tecla S)" aria-label="Selecionar área">' + ico('selecionar') + '</button>';
  h += '<span class="bsep"></span>';
  h += '<button class="bb" id="b-desfazer" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">' + ico('desfazer') + '</button>';
  h += '<button class="bb" id="b-refazer" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer">' + ico('refazer') + '</button>';
  h += '<span class="bsep"></span>';
  h += '<button class="bb" id="b-busca" title="Buscar card (Ctrl + F)" aria-label="Buscar card">' + ico('lupa') + '</button>';
  h += '<button class="bb" id="b-painel" title="Painel de propriedades" aria-label="Painel de propriedades">' + ico('painel') + '</button>';
  h += '<button class="bb" id="b-ajustes" title="Configurações do canvas" aria-label="Configurações do canvas">' + ico('ajustes') + '</button>';
  h += '<button class="bb" id="b-mais" title="Mais opções" aria-label="Mais opções">' + ico('mais') + '</button>';
  const b = $('#barra'); b.innerHTML = h;
  b.addEventListener('click', e => {
    const c = e.target.closest('[data-criar]'); if (c){ criarPelaBarra(c.dataset.criar); return; }
    const bt = e.target.closest('button'); if (!bt) return;
    const r = bt.getBoundingClientRect();
    if (bt.id === 'b-busca') abrirBusca();
    else if (bt.id === 'b-sel') alternarModoSel();
    else if (bt.id === 'b-desfazer') desfazer();
    else if (bt.id === 'b-refazer') refazer();
    else if (bt.id === 'b-painel'){ cfg.painel = !cfg.painel; salvarCfg(); renderPainel(true); }
    else if (bt.id === 'b-ajustes') abrirMenu(r.left, r.bottom + 6, [{secao: 'Configurações do canvas'}].concat(itensConfig()));
    else if (bt.id === 'b-mais') abrirMenu(r.left, r.bottom + 6, [
      {rotulo: 'Enquadrar tudo', icone: 'enquadrar', atalho: 'Shift+1', acao: enquadrar},
      {rotulo: 'Voltar pra 100%', icone: 'grade', acao: () => zoomEm(1 / view.k)},
      {rotulo: 'Atalhos do teclado', icone: 'teclado', atalho: '?', acao: mostrarAtalhos},
      {sep: true},
      {rotulo: 'Exportar backup (JSON)', icone: 'exportar', acao: exportar},
      {rotulo: 'Importar backup', icone: 'importar', desativado: ro(), acao: () => $('#arquivo').click()},
      {sep: true},
      {rotulo: 'Limpar este quadro', icone: 'limpar', perigo: true, desativado: ro() || !Q.nodes.length, acao: limparQuadro}
    ]);
  });
  $('#z-menos').innerHTML = ico('menos');
  $('#busca-ant').innerHTML = ico('cima'); $('#busca-prox').innerHTML = ico('baixo'); $('#busca-x').innerHTML = ico('x');
  $('#z-mais').innerHTML = ico('somar');
  $('#z-fit').innerHTML = ico('enquadrar');
  $('#z-menos').addEventListener('click', () => zoomEm(1 / 1.2));
  $('#z-mais').addEventListener('click', () => zoomEm(1.2));
  $('#z-fit').addEventListener('click', enquadrar);
  $('#zoom-n').addEventListener('click', () => zoomEm(1 / view.k));
}

/* ================= ganchos da ponte com o CicloDev ================= */
if (window.__PONTE){
  window.__PONTE.aoMudarDiagramas = () => { if (Q) render(); };
  window.__PONTE.aoLigar = o => { if (ro()) return; mutar(() => { const n = no(o.nodeId); if (n) n.diagramaId = o.diagramaId; }); };
  window.__PONTE.aoInserir = o => { if (ro()) return; const c = centroMundo(), d = (cascata++ % 6) * 24; criar('diagrama', {x: c.x + d, y: c.y + d}, null, {centrar: true, diagramaId: o.diagramaId}); };
}

montarBarra();

    setTimeout(() => {
      if (!carregado){ carregado = true; aplicarRO(); entrarNoQuadro('raiz'); status('erro'); toast('Não consegui carregar os quadros salvos. O que você fizer agora pode não ser salvo.'); }
    }, 12000);
  } else {
    carregarLocal();
    carregado = true;
    aplicarRO();
    entrarNoQuadro('raiz');
    status('local');
  }
})();
(async () => {
  try { dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch(e){ dl = null; }

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Canvas de Infraestrutura</title>
<meta name="description" content="Canvas da aba Infraestrutura do CicloDev: desenhos do sistema como código, com cards, ligações e quadros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --fundo:#030405;
    --pont:rgba(255,255,255,.085);
    --sup:#0E1114;
    --sup2:#14181C;
    --sup3:#1B2025;
    --linha:#242A31;
    --linha2:#333B44;
    --tinta:#ECEEF0;
    --tinta2:#A7B0B9;
    --tinta3:#6C7680;
    --ouro:#E5484D;
    --ouro2:#FF6B6F;
    --ouro-suave:rgba(229,72,77,.16);
    --perigo:#E5484D;
    --sans:'Jost', 'Segoe UI', system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--fundo);color:var(--tinta);font-family:var(--sans);font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ouro2);outline-offset:2px}
  svg{display:block}

  #app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;outline:none;
      background-color:var(--fundo);
      background-image:radial-gradient(circle, var(--pont) 1.1px, transparent 1.3px)}
  body.sem-grade #vp{background-image:none}
  #vp.panning{cursor:grabbing}
  #mundo{position:absolute;left:0;top:0;transform-origin:0 0}
  #svg-arestas{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none;z-index:500}
  #camada-nos,#camada-rotulos{position:absolute;left:0;top:0}
  #camada-rotulos{z-index:5000}
  #svg-fantasma{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none;z-index:4000;opacity:.16}
  #svg-fantasma .aresta{stroke-width:1.6}
  body.sem-fantasma #svg-fantasma{display:none}

  /* ---------- nós ---------- */
  .no{position:absolute;background:var(--sup);border:2px solid color-mix(in srgb, var(--cor) 72%, transparent);
      border-radius:8px;color:var(--tinta);box-shadow:0 14px 34px -22px #000, 0 0 0 1px rgba(0,0,0,.4);
      cursor:grab;user-select:none;-webkit-user-select:none}
  .no.sel{border-color:var(--ouro2);box-shadow:0 0 0 3px rgba(255,107,111,.22), 0 14px 34px -20px #000}
  .no.alvo{box-shadow:0 0 0 3px color-mix(in srgb, var(--cor) 45%, transparent)}
  body.arrastando .no{cursor:grabbing}
  [data-campo]:empty::before{content:attr(data-ph);color:var(--tinta3);font-weight:400}
  [data-campo].editando{outline:1px dashed var(--ouro);outline-offset:3px;cursor:text;user-select:text;-webkit-user-select:text;border-radius:3px}

  .no-corpo{padding:11px 13px 12px}
  .no-cab{display:flex;align-items:center;gap:7px;color:var(--cor);min-height:18px}
  .no-ico{width:15px;height:15px;flex:none}
  .no-ico svg{width:100%;height:100%}
  .no-tipo{font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
  .no-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
  .tag{font:600 9px/1 var(--mono);letter-spacing:.03em;padding:3px 6px;border-radius:99px;
       background:color-mix(in srgb, var(--cor) 18%, transparent);color:color-mix(in srgb, var(--cor) 85%, #fff);white-space:nowrap}
  .no-nota-b,.tp-nota,.tp-add{border:0;background:transparent;color:var(--tinta3);padding:2px;border-radius:4px;width:20px;height:20px;flex:none;
       opacity:0;transition:opacity .12s}
  .no-nota-b svg,.tp-nota svg,.tp-add svg{width:14px;height:14px;margin:auto}
  .no:hover .no-nota-b,.no.sel .no-nota-b,.no-nota-b.tem{opacity:1}
  .no-nota-b.tem,.tp-nota.tem{color:var(--ouro2)}
  .no-nota-b:hover,.tp-nota:hover{background:var(--sup3);color:var(--tinta)}
  .no-titulo{font-weight:600;font-size:15px;line-height:1.3;margin-top:7px;word-break:break-word;min-height:1.3em}
  .t-empresa .no-titulo{font-size:17px}
  .no-sub{font-size:12px;line-height:1.4;color:var(--tinta2);margin-top:2px;word-break:break-word}
  .no-meta{font-size:11.5px;color:var(--tinta3);margin-top:6px}
  .no-nota-txt,.tp-nota-txt{font-size:11.5px;line-height:1.45;color:var(--ouro2);background:var(--ouro-suave);border-radius:5px;padding:5px 7px;margin-top:7px;white-space:pre-wrap;word-break:break-word}
  .tp-nota-txt{grid-column:2 / 4;margin-top:3px;font-size:11px}
  .t-empresa .no-corpo{background:color-mix(in srgb, var(--cor) 12%, transparent);border-radius:6px 6px 0 0}
  .t-empresa.sem-topicos .no-corpo{border-radius:6px}
  .no-topicos{list-style:none;margin:0;padding:9px 13px 11px;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:3px}
  .no-topicos li{display:grid;grid-template-columns:11px 1fr 20px;align-items:start;font-size:12.5px;line-height:1.45;color:var(--tinta2)}
  .tp-marca{width:5px;height:5px;border-radius:99px;background:var(--cor);margin-top:.55em}
  .tp-texto{word-break:break-word;min-height:1.45em}
  .no-topicos li:hover .tp-nota{opacity:1}
  .no-corpo{position:relative}
  .cab-add{position:absolute;top:34px;right:11px;border:0;background:transparent;color:var(--tinta3);padding:2px;border-radius:4px;width:20px;height:20px;opacity:0;transition:opacity .12s}
  .cab-add svg{width:14px;height:14px;margin:auto}
  .no:hover .cab-add,.no.sel .cab-add{opacity:1}
  .cab-add:hover{background:var(--sup3);color:var(--ouro2)}
  body.ro .cab-add{display:none}
  .estruturado .no-titulo,.estruturado .no-sub{padding-right:24px}
  .no-add{position:absolute;left:10px;bottom:-27px;display:flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 6px;border-radius:6px;
       border:1px solid var(--linha2);background:var(--sup2);color:var(--tinta2);font-size:11.5px;opacity:0;pointer-events:none;transition:opacity .12s}
  .no-add::before{content:'';position:absolute;left:0;right:0;top:-6px;height:6px}
  .no-add svg{width:13px;height:13px}
  .no:hover .no-add,.no.sel .no-add{opacity:1;pointer-events:auto}
  .no-add:hover{color:var(--tinta);border-color:var(--ouro)}

  .t-cartao{display:flex;flex-direction:column}
  .no-texto{flex:1;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.55;overflow:hidden}
  .t-cartao .no-nota-b{position:absolute;top:4px;right:4px}

  .t-texto{background:transparent;border-color:transparent;box-shadow:none}
  .t-texto:hover{border-color:var(--linha2);border-style:dashed}
  .t-texto.sel{border-color:var(--ouro2);border-style:dashed;box-shadow:none}
  .no-livre{padding:2px 6px;white-space:pre-wrap;word-break:break-word;line-height:1.2;color:color-mix(in srgb, var(--cor) 55%, var(--tinta))}
  .t-texto[data-cor="cinza"] .no-livre{color:var(--tinta)}
  .no-livre.f-p{font-size:14px;line-height:1.45}
  .no-livre.f-m{font-size:20px}
  .no-livre.f-g{font-size:32px}
  .no-livre.f-xg{font-size:52px;line-height:1.05}
  .no-livre.neg{font-weight:700}

  .t-grupo{background:color-mix(in srgb, var(--cor) 6%, transparent);border:2px solid color-mix(in srgb, var(--cor) 55%, transparent);border-radius:10px;box-shadow:none}
  .t-grupo.sel{border-color:var(--ouro2)}
  .grupo-rotulo{position:absolute;left:-2px;bottom:100%;margin-bottom:6px;max-width:100%;padding:5px 11px;border-radius:6px;background:var(--cor);color:#0A0B0C;
       font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grupo-rotulo[data-campo]:empty::before{color:rgba(0,0,0,.55)}
  .grupo-rotulo.editando{outline-color:#0A0B0C;text-overflow:clip}

  .t-quadro{box-shadow:5px 5px 0 -2px var(--sup2), 5px 5px 0 0 var(--linha2), 10px 10px 0 -2px var(--sup2), 10px 10px 0 0 var(--linha), 0 18px 34px -20px #000}
  .t-quadro.sel{box-shadow:0 0 0 3px rgba(255,107,111,.22), 5px 5px 0 -2px var(--sup2), 5px 5px 0 0 var(--linha2), 10px 10px 0 -2px var(--sup2), 10px 10px 0 0 var(--linha)}

  .alca{position:absolute;width:calc(12px * var(--inv, 1));height:calc(12px * var(--inv, 1));border-radius:99px;background:var(--ouro);border:calc(2px * var(--inv, 1)) solid var(--fundo);opacity:0;cursor:crosshair;z-index:3;transition:opacity .12s}
  .alca::after{content:'';position:absolute;inset:-7px}
  .alca[data-lado="t"]{left:50%;top:calc(-7px * var(--inv, 1));margin-left:calc(-6px * var(--inv, 1))}
  .alca[data-lado="b"]{left:50%;bottom:calc(-7px * var(--inv, 1));margin-left:calc(-6px * var(--inv, 1))}
  .alca[data-lado="l"]{top:50%;left:calc(-7px * var(--inv, 1));margin-top:calc(-6px * var(--inv, 1))}
  .alca[data-lado="r"]{top:50%;right:calc(-7px * var(--inv, 1));margin-top:calc(-6px * var(--inv, 1))}
  .no:hover .alca,.no.sel .alca,body.conectando .alca{opacity:1}
  .estruturado .alca[data-lado="b"]{bottom:calc(-7px * var(--inv, 1))}
  .redim{position:absolute;right:-2px;bottom:-2px;width:calc(16px * var(--inv, 1));height:calc(16px * var(--inv, 1));cursor:nwse-resize;opacity:0;z-index:6}
  .redim::before{content:'';position:absolute;right:calc(3px * var(--inv, 1));bottom:calc(3px * var(--inv, 1));width:calc(8px * var(--inv, 1));height:calc(8px * var(--inv, 1));border-right:calc(2px * var(--inv, 1)) solid var(--ouro);border-bottom:calc(2px * var(--inv, 1)) solid var(--ouro);border-radius:0 0 2px 0}
  .t-painel .redim{opacity:.55}
  .t-painel .redim::before{border-color:var(--ouro2)}
  .estruturado .redim,.t-quadro .redim,.t-texto .redim{cursor:ew-resize}
  .no:hover .redim,.no.sel .redim{opacity:1}
  body.ro .alca,body.ro .redim,body.ro .no-add{display:none}
  body.ro .no{cursor:default}

  .t-diagrama{display:flex;flex-direction:column;overflow:hidden}
  .dg-cab{display:flex;align-items:center;gap:7px;color:var(--cor);padding:9px 11px 0;min-height:18px}
  .dg-cab .no-nota-b{opacity:1}
  .dg-abrir{border:0;background:transparent;color:var(--tinta3);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0;flex:none}
  .dg-abrir svg{width:14px;height:14px}
  .dg-abrir:hover{background:var(--sup3);color:var(--tinta)}
  .dg-titulo{font-weight:600;font-size:14.5px;padding:6px 12px 8px;word-break:break-word}
  .dg-img{flex:1;min-height:0;margin:0 8px 8px;background:#FFFFFF;border-radius:5px;display:grid;place-items:center;overflow:hidden}
  .dg-img img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none}
  .dg-sem{flex:1;min-height:0;margin:0 8px 8px;border:1px dashed var(--linha2);border-radius:5px;padding:12px;color:var(--tinta3);font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow:hidden}
  .dg-vazio{flex:1;margin:0 8px 8px;border:1px dashed var(--ouro);border-radius:5px;background:var(--ouro-suave);color:var(--tinta);font-size:13px}
  body.ro .dg-vazio{pointer-events:none;opacity:.6}

  /* ---------- arestas ---------- */
  .aresta{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .aresta.trac{stroke-dasharray:7 6}
  g.sel .aresta{stroke-width:3}
  .aresta-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
  body.ro .aresta-hit{cursor:default}
  .temp{fill:none;stroke:var(--ouro);stroke-width:2;stroke-dasharray:6 4}
  .guia{stroke:var(--ouro);stroke-width:1;stroke-dasharray:4 4;opacity:.8}
  .rotulo-aresta{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:220px;padding:3px 8px;border-radius:6px;background:var(--sup2);border:1px solid var(--linha2);
       color:var(--tinta);font-size:11.5px;line-height:1.35;text-align:center;white-space:pre-wrap;word-break:break-word;cursor:pointer;display:flex;align-items:center;gap:5px}
  .rotulo-aresta.sel{border-color:var(--ouro2)}
  .rot-nota{width:6px;height:6px;border-radius:99px;background:var(--ouro2);flex:none}
  .nota-aresta{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:99px;background:var(--sup2);border:1px solid var(--ouro);color:var(--ouro2);display:grid;place-items:center;cursor:pointer}
  .nota-aresta svg{width:12px;height:12px}

  #caixa-sel{position:absolute;border:1.5px dashed var(--ouro2);border-radius:10px;background:rgba(255,107,111,.04);cursor:move;z-index:999}
  #caixa-sel[hidden]{display:none}
  body.modo-sel #vp{cursor:crosshair}
  #selecao-caixa{position:fixed;border:1px solid var(--ouro);background:rgba(229,72,77,.08);pointer-events:none;z-index:5}

  #vazio{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;max-width:min(480px, calc(100vw - 32px))}
  #vazio h1{margin:0 0 8px;font-weight:500;font-size:22px;letter-spacing:.01em;color:var(--tinta)}
  #vazio p{margin:0;color:var(--tinta3);font-size:13px;line-height:1.6;text-wrap:balance}
  #vazio kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--linha2);border-radius:4px;color:var(--tinta2)}

  /* ---------- UI flutuante ---------- */
  .flut{position:absolute;z-index:20;background:rgba(10,12,14,.94);border:1px solid var(--linha2);border-radius:10px;box-shadow:0 12px 30px -16px #000;backdrop-filter:blur(6px)}
  #barra{left:16px;top:16px;display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
  #barra::-webkit-scrollbar{display:none}
  .bb{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--tinta2)}
  .bb svg{width:18px;height:18px}
  .bb:hover{background:var(--sup3);color:var(--ouro2)}
  .bb.ativo{background:var(--ouro-suave);color:var(--ouro2)}
  .bb:disabled{opacity:.35;cursor:default;background:transparent;color:var(--tinta2)}
  .bsep{width:1px;height:22px;background:var(--linha2);margin:0 4px;flex:none}

  #trilha{left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 6px;max-width:calc(100vw - 32px);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
  #trilha::-webkit-scrollbar{display:none}
  #trilha[hidden]{display:none}
  .tr-b{border:0;background:transparent;color:var(--tinta2);padding:6px 9px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:6px}
  .tr-b:hover{background:var(--sup3);color:var(--tinta)}
  .tr-b.atual{color:var(--tinta);font-weight:600}
  .tr-b svg{width:15px;height:15px}
  .tr-sep{color:var(--tinta3);font-size:12px}

  #status{right:16px;top:16px;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--tinta2)}
  #status i{width:7px;height:7px;border-radius:99px;background:var(--tinta3);flex:none}
  #status[data-e="salvo"] i{background:#46A758}
  #status[data-e="local"] i{background:#E5C02A}
  #status[data-e="pendente"] i,#status[data-e="salvando"] i{background:var(--ouro)}
  #status[data-e="erro"] i{background:var(--perigo)}
  #status[data-e="ro"] i{background:var(--ouro2)}

  #zoom{right:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:4px}
  #zoom-n{font:600 11.5px var(--mono);color:var(--tinta2);width:48px;text-align:center;border:0;background:transparent;border-radius:6px;height:30px}
  #zoom-n:hover{background:var(--sup3)}
  #zoom .bb{width:30px;height:30px}
  #zoom .bb svg{width:16px;height:16px}

  #minimapa{position:absolute;left:16px;bottom:16px;z-index:20;width:180px;height:120px;border-radius:10px;border:1px solid var(--linha2);background:rgba(10,12,14,.94);cursor:pointer}
  body.sem-mini #minimapa{display:none}

  /* ---------- estado do card e status dos tópicos ---------- */
  .no-estado{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .est{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--linha2);background:transparent;border-radius:5px;padding:2px 7px 2px 5px;
       font:600 9px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--tinta3)}
  .est i{width:9px;height:9px;border:1.5px solid currentColor;border-radius:2px;flex:none}
  button.est:hover{color:var(--tinta);border-color:var(--tinta3)}
  .est.on-a{color:#5BC46E;border-color:rgba(70,167,88,.6);background:rgba(70,167,88,.13)}
  .est.on-a i{background:#46A758;border-color:#46A758}
  .est.on-i{color:#FF8D8F;border-color:rgba(229,72,77,.55);background:rgba(229,72,77,.11)}
  .est.on-i i{background:#E5484D;border-color:#E5484D}
  .est-ok{color:#5BC46E;border-color:rgba(70,167,88,.6);background:rgba(70,167,88,.13)}
  .no.concluido{border-color:rgba(70,167,88,.75)}
  .no-topicos li{grid-template-columns:18px 1fr auto auto !important}
  .tp-st{width:13px;height:13px;border:1.5px solid var(--tinta3);border-radius:3px;background:transparent;padding:0;margin-top:.22em;cursor:pointer;position:relative}
  .tp-st:hover{border-color:var(--tinta)}
  .tp-st.andamento{border-color:#E5C02A;background:linear-gradient(90deg,#E5C02A 50%,transparent 50%)}
  .tp-st.concluido{border-color:#46A758;background:#46A758}
  .tp-st.concluido::after{content:'';position:absolute;left:3.5px;top:0.5px;width:3px;height:7px;border:solid #07110A;border-width:0 2px 2px 0;transform:rotate(45deg)}
  li.st-concluido .tp-texto{color:var(--tinta3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
  .tp-cv{border:0;background:transparent;color:var(--tinta3);padding:2px;border-radius:4px;width:20px;height:20px;opacity:0;transition:opacity .12s}
  .tp-cv svg{width:14px;height:14px;margin:auto}
  .tp-cv.tem{opacity:1;color:var(--ouro2)}
  .no-topicos li:hover .tp-cv{opacity:1}
  .tp-cv:hover{background:var(--sup3);color:var(--tinta)}
  .tp-nota{opacity:1}
  .tp-nota-txt{grid-column:2 / 5 !important}
  .tp-nota:not(.tem){display:none}
  body.ro .est:not(.est-ok):not(.on-a):not(.on-i){display:none}
  .grupo-tab{position:absolute;left:-2px;bottom:100%;margin-bottom:6px;display:flex;align-items:center;gap:6px;max-width:calc(100% + 4px)}
  .grupo-tab .grupo-rotulo{position:static;margin:0}
  .grupo-tab .est{background:var(--fundo)}
  .grupo-tab .est.on-a{background:#0B1A0F}.grupo-tab .est.on-i{background:#1F0B0C}.grupo-tab .est-ok{background:#0B1A0F}

  /* ---------- painel central ---------- */
  .t-painel{background:#06080A;border-color:var(--ouro);box-shadow:0 0 0 1px rgba(229,72,77,.25), 0 30px 60px -30px #000;cursor:grab}
  .pc-wrap{position:absolute;inset:0;overflow:hidden;border-radius:6px}
  .pc-escala{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0}

<script>
/* Ponte com o CicloDev: o canvas roda dentro da aba Infraestrutura e grava no banco do CicloDev (infra_canvas).
   Tudo o que o canvas guardava sozinho passa por aqui: os documentos (quadros e eventos), as preferências de
   zoom e de exibição, os downloads e os desenhos do sistema (infra_diagramas) mostrados nos cards "Desenho". */
(function(){
  const INIT = window.__INFRA_INIT || {docs:{}, ls:{}, diagramas:{}, ns:'local', ro:false};
  const copia = o => o == null ? o : JSON.parse(JSON.stringify(o));
  let seq = 0; const esperando = new Map();
  const falar = m => { try { parent.postMessage(Object.assign({__infra:true, ns:INIT.ns}, m), '*'); } catch(e){} };
  const enviar = (tipo, dados) => new Promise((res, rej) => { const id = ++seq; esperando.set(id, {res, rej}); falar({id, tipo, dados}); });
  const docs = new Map(Object.entries(INIT.docs || {}));
  const colOuv = [], docOuv = {};
  const P = window.__PONTE = {
    init: INIT, diagramas: INIT.diagramas || {},
    lerLS(k, d){ const v = (INIT.ls || {})[k]; return v === undefined ? d : copia(v); },
    gravarLS(k, v){ (INIT.ls = INIT.ls || {})[k] = copia(v); falar({tipo:'ls', dados:{k, v}}); },
    pedir(tipo, dados){ falar({tipo, dados}); },
    aoMudarDiagramas: null, aoLigar: null, aoInserir: null
  };
  window.addEventListener('message', e => {
    if (e.source !== parent) return;
    const m = e.data || {}; if (!m.__infra) return;
    if (m.resposta){ const w = esperando.get(m.resposta); if (w){ esperando.delete(m.resposta); if (m.erro) w.rej(m.erro); else w.res(); } return; }
    if (m.tipo === 'remoto'){
      const c = m.dados.caminho, d = m.dados.dados, i = c.indexOf('/'), col = c.slice(0, i), id = c.slice(i + 1);
      if (d == null) docs.delete(c); else docs.set(c, copia(d));
      colOuv.filter(o => o.nome === col).forEach(o => o.cb({docChanges: () => [{type: d == null ? 'removed' : 'modified', doc: {id, data: () => copia(d)}}]}));
      (docOuv[c] || []).forEach(cb => cb({exists: d != null, data: () => copia(d)}));
    }
    if (m.tipo === 'diagramas'){ P.diagramas = m.dados || {}; if (P.aoMudarDiagramas) P.aoMudarDiagramas(); }
    if (m.tipo === 'ligar-diagrama' && P.aoLigar) P.aoLigar(m.dados);
    if (m.tipo === 'inserir-diagrama' && P.aoInserir) P.aoInserir(m.dados);
  });
  const db = {
    collection(nome){ return {onSnapshot(cb){ colOuv.push({nome, cb});
      const ch = [...docs].filter(([k]) => k.startsWith(nome + '/')).map(([k, v]) => ({type:'added', doc:{id:k.slice(nome.length + 1), data:() => copia(v)}}));
      setTimeout(() => cb({docChanges: () => ch}), 0); return () => {}; }}; },
    doc(caminho){ return {
      set(d){ docs.set(caminho, copia(d)); return enviar('set', {caminho, dados:d}); },
      delete(){ docs.delete(caminho); return enviar('delete', {caminho}); },
      onSnapshot(cb){ (docOuv[caminho] = docOuv[caminho] || []).push(cb); setTimeout(() => cb({exists: docs.has(caminho), data: () => copia(docs.get(caminho))}), 0); return () => {}; }
    }; }
  };
  const dl = {save(o){ return enviar('baixar', {filename:o.filename, data:o.data}); }};
  window.claude = {use: async c => c === 'db' ? db : c === 'downloads' ? dl : null};
  falar({tipo:'pronto'});
})();
</script>

/* ================= salvar / carregar ================= */
let timerSalvar = null, salvando = false;
function agendarSalvar(id){
  sujos.add(id);
  status('pendente');
  clearTimeout(timerSalvar);
  timerSalvar = setTimeout(descarregar, 650);
}
function salvarLocal(){ gravarLS('canvas-bl-quadros', quadros); }
async function descarregar(){
  if (salvando) return;
  salvando = true;
  status('salvando');
  while (sujos.size){
    const id = sujos.values().next().value;
    sujos.delete(id);
    const q = quadros[id];
    if (!db){ salvarLocal(); continue; }
    try {
      if (!q){
        await db.doc('quadros/' + id).delete();
        delete ultimoEnviado[id];
      } else {
        const j = corpoJSON(q);
        if (ultimoEnviado[id] === j) continue;
        if (j.length > 250000){
          toast('Este quadro ficou grande demais pra salvar. Separe parte dele num quadro novo.');
          continue;
        }
        const anterior = ultimoEnviado[id];
        ultimoEnviado[id] = j;
        try { await db.doc('quadros/' + id).set({nome: q.nome, pai: q.pai || null, nodes: q.nodes, edges: q.edges, atualizadoEm: Date.now()}); }
        catch (e2){ if (ultimoEnviado[id] === j) ultimoEnviado[id] = anterior; throw e2; }
      }
    } catch (err){
      const c = err && err.code;
      if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted'){
        semPermissao = true; sujos.clear(); salvando = false;
        aplicarRO(); status('ro');
        toast('Você só tem permissão pra ver este canvas.');
        return;
      }
      if (c === 'quota_exceeded') toast('O limite de quadros deste canvas foi atingido. Apague quadros que não usa mais.');
      sujos.add(id);
      salvando = false;
      status('erro');
      setTimeout(descarregar, 2500 + Math.random() * 2500);
      return;
    }
  }
  salvando = false;
  if (!sujos.size) status(db ? 'salvo' : 'local');
}
function carregarLocal(){
  const q = lerLS('canvas-bl-quadros', {});
  quadros = {};
  Object.keys(q || {}).forEach(id => { quadros[id] = normalizar(q[id]); });
}
function assinar(){
  db.collection('quadros').onSnapshot(snap => {
    let mudouAtual = false, mudouOutro = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed'){
        if (sujos.has(id)) return;
        if (quadros[id]){ delete quadros[id]; delete ultimoEnviado[id]; if (id === atualId) mudouAtual = true; else mudouOutro = true; }
        return;
      }
      const d = normalizar(ch.doc.data());
      const j = corpoJSON(d);
      if (ultimoEnviado[id] === j) return;
      if (sujos.has(id)) return;
      if (carregado && id === atualId && interagindo()){ remotoPendente[id] = j; return; }
      const antesRemoto = quadros[id] ? corpoJSON(quadros[id]) : null;
      quadros[id] = JSON.parse(j);
      ultimoEnviado[id] = j;
      if (carregado && antesRemoto !== j && hist[id] && (hist[id].undo.length || hist[id].redo.length)){ delete hist[id]; if (id === atualId) toast('O quadro foi atualizado de fora. O desfazer recomeça a partir daqui.'); }
      if (id === atualId) mudouAtual = true; else mudouOutro = true;
    });
    if (!carregado){
      carregado = true;
      aplicarRO();
      entrarNoQuadro('raiz');
      if (!semPermissao) status(sujos.size ? 'pendente' : 'salvo');
      return;
    }
    if (mudouAtual){
      if (!quadros[atualId] && atualId !== 'raiz'){ entrarNoQuadro('raiz'); return; }
      Q = garantir(atualId); podarSel(); render(); renderPainel(true); renderTrilha();
    } else if (mudouOutro){ render(); renderTrilha(); }
  }, () => { status('erro'); });
}
function interagindo(){
  return !!acao || !!editando || !pop.hidden || painel.contains(document.activeElement);
}
function aplicarRemotoPendente(){
  const j = remotoPendente[atualId];
  if (!j || interagindo()) return;
  delete remotoPendente[atualId];
  if (sujos.has(atualId)) return;
  const antesRemoto = corpoJSON(quadros[atualId] || {nome:'', nodes:[], edges:[]});
  quadros[atualId] = JSON.parse(j);
  ultimoEnviado[atualId] = j;
  if (antesRemoto !== j && hist[atualId] && (hist[atualId].undo.length || hist[atualId].redo.length)){ delete hist[atualId]; toast('O quadro foi atualizado de fora. O desfazer recomeça a partir daqui.'); }
  Q = quadros[atualId];
  podarSel(); render(); renderPainel(true); renderTrilha();
}

let rafMini = 0, timerVista = 0;
function aplicarView(){

  mundo.style.setProperty('--inv', clamp(1 / view.k, 1, 8).toFixed(3));
  let passo = GRADE * view.k;
  while (passo < 11) passo *= 5;
  vp.style.backgroundSize = passo + 'px ' + passo + 'px';
  vp.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('#zoom-n').textContent = Math.round(view.k * 100) + '%';

  timerVista = setTimeout(() => { if (!carregado) return; vistas[atualId] = {x: view.x, y: view.y, k: view.k}; gravarLS('canvas-bl-vistas', vistas); }, 400);
}
function mundoDe(cx, cy){
  const r = vp.getBoundingClientRect();
  return {x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k};
}
function centroMundo(){ const r = vp.getBoundingClientRect(); return mundoDe(r.left + r.width / 2, r.top + r.height / 2); }
function zoomEm(f, cx, cy){
  const r = vp.getBoundingClientRect();
  if (cx == null){ cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const nk = clamp(view.k * f, 0.08, 4);
  const px = cx - r.left, py = cy - r.top;
  view.x = px - (px - view.x) * (nk / view.k);
  view.y = py - (py - view.y) * (nk / view.k);
  view.k = nk;
  aplicarView();
}
function limites(nodes){
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  nodes.forEach(n => { const s = tam(n); a = Math.min(a, n.x); b = Math.min(b, n.y - (n.tipo === 'grupo' ? 34 : 0)); c = Math.max(c, n.x + s.w); d = Math.max(d, n.y + s.h); });
  return {x: a, y: b, w: c - a, h: d - b};
}
function enquadrar(){
  if (!Q.nodes.length){ centralizar(); return; }
  const L = limites(Q.nodes), r = vp.getBoundingClientRect(), pad = 90;
  const k = clamp(Math.min((r.width - pad * 2) / Math.max(L.w, 1), (r.height - pad * 2) / Math.max(L.h, 1)), 0.08, 1.2);
  view.k = k;
  view.x = r.width / 2 - (L.x + L.w / 2) * k;
  view.y = r.height / 2 - (L.y + L.h / 2) * k;
  aplicarView();
}
function centralizar(){ const r = vp.getBoundingClientRect(); view = {x: r.width / 2, y: r.height / 2, k: 1}; aplicarView(); }

function novoNo(tipo, x, y){
  const t = TIPOS[tipo];
  const n = {id: uid('n'), tipo, x, y, w: t.w, cor: t.cor};
  if (t.h) n.h = t.h;
  if (t.estruturado){ n.titulo = ''; n.subtitulo = ''; n.etiquetas = []; n.topicos = []; n.nota = ''; }
  if (tipo === 'cartao'){ n.texto = ''; n.nota = ''; }
  if (tipo === 'texto'){ n.texto = ''; n.fonte = 'm'; n.negrito = false; }
  if (tipo === 'grupo'){ n.titulo = ''; n.nota = ''; }
  if (tipo === 'quadro'){ n.titulo = 'Novo quadro'; n.nota = ''; }
  if (tipo === 'diagrama'){ n.diagramaId = null; n.nota = ''; }
  return n;
}
function arestaPadrao(){ return {rotulo: '', cor: 'cinza', estilo: cfg.estiloLinha, tracejada: false, setas: 'fim', nota: ''}; }
function nomeNo(n){
  if (!n) return '';
  if (n.tipo === 'quadro') return (quadros[n.quadroId] && quadros[n.quadroId].nome) || n.titulo || 'Quadro';
  if (n.tipo === 'cartao' || n.tipo === 'texto') return (n.texto || '').split('\n')[0].slice(0, 40) || TIPOS[n.tipo].nome;
  if (n.tipo === 'diagrama'){ const d = diag(n.diagramaId); return d ? d.nome : 'Desenho do sistema'; }
  return n.titulo || TIPOS[n.tipo].tituloPadrao || TIPOS[n.tipo].nome;
}
const opostos = {t:'b', b:'t', l:'r', r:'l'};
function criar(tipo, pt, conectar, opts){
  if (ro()) return;
  mutar(() => {
    const t = TIPOS[tipo];
    let x = pt.x, y = pt.y;
    if (opts && opts.centrar){ x -= t.w / 2; y -= (t.h || 90) / 2; }
    if (conectar){
      const w = t.w, h = t.h || 100;
      if (conectar.lado === 'l'){ x = pt.x - w; y = pt.y - h / 2; }
      else if (conectar.lado === 'r'){ y = pt.y - h / 2; }
      else if (conectar.lado === 't'){ x = pt.x - w / 2; y = pt.y - h; }
      else { x = pt.x - w / 2; }
    }
    if (cfg.snapGrade){ x = snapV(x); y = snapV(y); }
    const n = novoNo(tipo, x, y);
    if (tipo === 'diagrama' && opts && opts.diagramaId) n.diagramaId = opts.diagramaId;

/* ================= painel central ================= */
const DIA = 86400000;
function quando(t){
  if (!t) return '';
  const d = Date.now() - t;
  if (d < 60000) return 'agora';
  if (d < 3600000) return 'há ' + Math.round(d / 60000) + ' min';
  if (d < DIA) return 'há ' + Math.round(d / 3600000) + ' h';
  if (d < 2 * DIA) return 'ontem';
  if (d < 30 * DIA) return 'há ' + Math.round(d / DIA) + ' dias';
  return new Date(t).toLocaleDateString('pt-BR');
}
function calcularPainel(){
  const agora = Date.now();
  const R = {cards: 0, tops: 0, st: {afazer: 0, andamento: 0, concluido: 0}, ativos: 0, inativos: 0, concl: 0, semEstado: 0,
             grupos: [], concluidos: [], parados: [], velhos: [], duvidas: 0, quadros: 0};
  for (const qid of Object.keys(quadros)){
    const q = quadros[qid]; R.quadros++;
    const eg = qid === atualId ? estadoGrupos : calcularGrupos(q, false);
    const temArea = q.nodes.some(n => n.tipo === 'grupo' && n.area);
    q.nodes.forEach(n => {
      if (n.tipo === 'cartao' && /^\s*d[uú]vidas/i.test(n.texto || '')) R.duvidas += ((n.texto || '').match(/^\s*\d+\./gm) || []).length;
      if (n.tipo === 'grupo' && eg[n.id] && eg[n.id].total && (n.area || !temArea)) R.grupos.push({q: qid, id: n.id, nome: n.titulo || 'Grupo', c: eg[n.id].c, total: eg[n.id].total, x: n.x, y: n.y, estado: n.estado || ''});
      if (!TIPOS[n.tipo] || !TIPOS[n.tipo].estruturado) return;
      R.cards++;
      const e = estadoCard(n);
      if (e === 'concluido') R.concl++; else if (e === 'ativo') R.ativos++; else if (e === 'inativo'){ R.inativos++; R.parados.push({q: qid, id: n.id, nome: nomeNo(n), t: n.estadoEm}); } else R.semEstado++;
      (n.topicos || []).forEach(t => {
        const s = stDe(t); R.tops++; R.st[s]++;
        if (s === 'concluido' && t.statusEm) R.concluidos.push({q: qid, id: n.id, nome: t.texto || 'Tópico', card: nomeNo(n), t: t.statusEm});
        if (s === 'andamento' && t.statusEm && agora - t.statusEm > 7 * DIA) R.velhos.push({q: qid, id: n.id, nome: t.texto || 'Tópico', card: nomeNo(n), t: t.statusEm});
      });
    });
  }
  R.concluidos.sort((a, b) => b.t - a.t);
  R.grupos.sort((a, b) => (a.y - b.y) || (a.x - b.x));
  // linha do tempo: 14 dias
  const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
  const dias = [];
  for (let i = 13; i >= 0; i--) dias.push({ini: hoje0.getTime() - i * DIA, concl: 0, outros: 0});
  eventos.forEach(ev => {
    const d = dias.find(x => ev.t >= x.ini && ev.t < x.ini + DIA); if (!d) return;
    if (ev.tipo === 'concluido' || ev.tipo === 'card_concluido') d.concl++; else d.outros++;
  });
  R.dias = dias;
  const semana = eventos.filter(ev => ev.tipo === 'concluido' && agora - ev.t < 7 * DIA).length;
  const semAnt = eventos.filter(ev => ev.tipo === 'concluido' && agora - ev.t >= 7 * DIA && agora - ev.t < 14 * DIA).length;
  R.semana = semana; R.semAnt = semAnt;
  R.recentes = eventos.slice(0, 8);
  R.pct = R.tops ? Math.round(R.st.concluido / R.tops * 100) : 0;
  R.assin = {c: R.cards, t: R.tops, st: R.st, a: R.ativos, i: R.inativos, k: R.concl, g: R.grupos.map(g => [g.nome, g.c.concluido, g.c.andamento, g.total]), e: eventos.length ? eventos[0].t : 0, min: Math.floor(agora / 60000)};
  return R;
}

function calcularGrupos(q, medir){
  const out = {};

  const est = q.nodes.filter(n => TIPOS[n.tipo] && TIPOS[n.tipo].estruturado);
  q.nodes.filter(n => n.tipo === 'grupo').forEach(g => {
    const gs = tamDe(g);
    const dentro = est.filter(n => { const s = tamDe(n); return n.x >= g.x && n.y >= g.y && n.x + s.w <= g.x + gs.w + 1 && n.y + s.h <= g.y + gs.h + 1; });
    const c = {afazer: 0, andamento: 0, concluido: 0};
    dentro.forEach(n => (n.topicos || []).forEach(t => c[stDe(t)]++));
    const total = c.afazer + c.andamento + c.concluido;
    out[g.id] = {c, total, cards: dentro.length, concluido: total > 0 && c.concluido === total};
  });
  return out;
}

const DIR = {t:[0,-1], b:[0,1], l:[-1,0], r:[1,0]};
function pontoLado(n, lado){
  const s = tam(n);
  if (lado === 't') return {x: n.x + s.w / 2, y: n.y};
  if (lado === 'b') return {x: n.x + s.w / 2, y: n.y + s.h};
  if (lado === 'l') return {x: n.x, y: n.y + s.h / 2};
  return {x: n.x + s.w, y: n.y + s.h / 2};
}
function caminho(estilo, l1, l2, p1, p2){
  const d1 = DIR[l1] || [1,0], d2 = DIR[l2] || [-1,0];
  const f = v => Math.round(v * 10) / 10;
  if (estilo === 'reta') return {d: 'M' + f(p1.x) + ',' + f(p1.y) + ' L' + f(p2.x) + ',' + f(p2.y), meio: {x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2}};
  if (estilo === 'angulo'){
    const o = 26;
    const a = {x: p1.x + d1[0] * o, y: p1.y + d1[1] * o}, b = {x: p2.x + d2[0] * o, y: p2.y + d2[1] * o};
    let pts;
    if (d1[0] !== 0){ const mx = (a.x + b.x) / 2; pts = [p1, a, {x: mx, y: a.y}, {x: mx, y: b.y}, b, p2]; }
    else { const my = (a.y + b.y) / 2; pts = [p1, a, {x: a.x, y: my}, {x: b.x, y: my}, b, p2]; }
    return {d: 'M' + pts.map(q => f(q.x) + ',' + f(q.y)).join(' L'), meio: {x: (pts[2].x + pts[3].x) / 2, y: (pts[2].y + pts[3].y) / 2}};
  }
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const off = clamp(dist * 0.42, 40, 240);
  const c1 = {x: p1.x + d1[0] * off, y: p1.y + d1[1] * off}, c2 = {x: p2.x + d2[0] * off, y: p2.y + d2[1] * off};
  return {
    d: 'M' + f(p1.x) + ',' + f(p1.y) + ' C' + f(c1.x) + ',' + f(c1.y) + ' ' + f(c2.x) + ',' + f(c2.y) + ' ' + f(p2.x) + ',' + f(p2.y),
    meio: {x: .125 * p1.x + .375 * c1.x + .375 * c2.x + .125 * p2.x, y: .125 * p1.y + .375 * c1.y + .375 * c2.y + .125 * p2.y}
  };
}

/* ================= trilha de quadros ================= */
function cadeia(id){
  const c = []; let cur = id, guarda = 0;
  while (cur && guarda++ < 50){ c.unshift(cur); cur = quadros[cur] ? quadros[cur].pai : null; }
  if (c[0] !== 'raiz') c.unshift('raiz');
  return [...new Set(c)];
}
function renderTrilha(){
  const t = $('#trilha');
  const c = cadeia(atualId);
  if (c.length <= 1 && atualId === 'raiz'){ t.hidden = true; t.innerHTML = ''; return; }
  t.hidden = false;
  const pai = c[c.length - 2];
  let h = '<button class="tr-b" data-q="' + esc(pai) + '" title="Voltar" aria-label="Voltar">' + ico('voltar') + '</button>';
  c.forEach((id, i) => {
    const nome = quadros[id] ? quadros[id].nome : (id === 'raiz' ? 'Quadro principal' : 'Quadro');
    if (i) h += '<span class="tr-sep">/</span>';
    h += '<button class="tr-b' + (id === atualId ? ' atual' : '') + '" data-q="' + esc(id) + '">' + (i === 0 ? ico('quadro') : '') + esc(nome) + '</button>';
  });
  t.innerHTML = h;
}
$('#trilha').addEventListener('click', e => {

function entrarNoQuadro(id){

function abrirQuadro(n){
  if (!n) return;

/* ================= edição no próprio card ================= */
function valorCampo(n, ed){
  if (ed.campo === 'topico'){ const tp = (n.topicos || []).find(t => t.id === ed.tid); return tp ? tp.texto : ''; }
  if (ed.campo === 'titulo' && n.tipo === 'quadro') return nomeNo(n);
  return n[ed.campo] || '';
}
function definirCampo(n, ed, val){
  if (ed.campo === 'topico'){
    const i = (n.topicos || []).findIndex(t => t.id === ed.tid);
    if (i < 0) return;
    if (val === '' && !n.topicos[i].nota && !n.topicos[i].quadroId) n.topicos.splice(i, 1);
    else { n.topicos[i].texto = val; const qq = n.topicos[i].quadroId && quadros[n.topicos[i].quadroId]; if (qq){ qq.nome = val || 'Tópico'; agendarSalvar(n.topicos[i].quadroId); } }
    return;
  }
  n[ed.campo] = val;
  if (ed.campo === 'titulo' && n.tipo === 'quadro' && quadros[n.quadroId]){ quadros[n.quadroId].nome = val || 'Quadro'; agendarSalvar(n.quadroId); renderTrilha(); }
}
function textoDe(el, campo){
  if (campo === 'texto') return el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  return el.textContent.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
function editarCampo(el){
  const noEl = el.closest('.no'); if (!noEl) return;
  const n = no(noEl.dataset.id); if (!n || ro()) return;
  if (editando) encerrarEdicao(true, true);
  const li = el.closest('li[data-tid]');
  editando = {nodeId: n.id, campo: el.dataset.campo, tid: li ? li.dataset.tid : null, el};
  el.classList.add('editando');
  try { el.contentEditable = 'plaintext-only'; } catch(e){ el.contentEditable = 'true'; }
  if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
  el.focus();
  const rg = document.createRange(); rg.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(rg);
  el.addEventListener('blur', function aoSair(){ el.removeEventListener('blur', aoSair); if (editando && editando.el === el) encerrarEdicao(true); });
}
function encerrarEdicao(salvar, semRender){
  const ed = editando; if (!ed) return;
  editando = null;
  ed.el.contentEditable = 'false';
  ed.el.classList.remove('editando');
  const val = textoDe(ed.el, ed.campo);
  const noEl = ed.el.closest('.no');
  if (noEl) noEl._assin = null;
  const n = no(ed.nodeId);
  if (salvar && n && !ro() && (val !== valorCampo(n, ed) || (ed.campo === 'topico' && val === ''))){
    mutar(() => definirCampo(n, ed, val));

}
function teclaEdicao(e){
  const ed = editando;
  if (e.key === 'Escape'){ e.preventDefault(); encerrarEdicao(true); vp.focus(); return; }
  if (e.key === 'Enter' && !e.shiftKey && (ed.campo === 'titulo' || ed.campo === 'subtitulo')){ e.preventDefault(); encerrarEdicao(true); vp.focus(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && ed.campo === 'texto'){ e.preventDefault(); encerrarEdicao(true); vp.focus(); return; }
  if (ed.campo !== 'topico') return;
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const nodeId = ed.nodeId, tid = ed.tid, val = textoDe(ed.el, 'topico');
    editando = null; ed.el.contentEditable = 'false'; ed.el.classList.remove('editando');
    mutar(() => {
      const n = no(nodeId); if (!n) return;
      const i = n.topicos.findIndex(t => t.id === tid);
      if (i >= 0) n.topicos[i].texto = val;
      const novo = {id: uid('t'), texto: '', nota: ''};
      n.topicos.splice(i + 1, 0, novo);
      focoPendente = {nodeId, tid: novo.id};
    });
    return;
  }
  if (e.key === 'Backspace' && textoDe(ed.el, 'topico') === ''){
    e.preventDefault();
    const nodeId = ed.nodeId, tid = ed.tid;
    editando = null; ed.el.contentEditable = 'false'; ed.el.classList.remove('editando');
    mutar(() => {
      const n = no(nodeId); if (!n) return;
      const i = n.topicos.findIndex(t => t.id === tid);
      if (i >= 0 && !n.topicos[i].nota && !n.topicos[i].quadroId){
        n.topicos.splice(i, 1);
        const prev = n.topicos[i - 1];
        if (prev) focoPendente = {nodeId, tid: prev.id};
      }
    });
  }
}
function editarTitulo(n){
  const el = elsNo.get(n.id); if (!el) return;
  const c = el.querySelector('[data-campo="titulo"]') || el.querySelector('[data-campo="texto"]');
  if (c) editarCampo(c);
}
function adicionarTopico(nodeId, depoisDe){
  mutar(() => {
    const n = no(nodeId); if (!n) return;
    const novo = {id: uid('t'), texto: '', nota: ''};
    n.topicos = n.topicos || [];
    const i = depoisDe ? n.topicos.findIndex(t => t.id === depoisDe) : -1;
    if (i >= 0) n.topicos.splice(i + 1, 0, novo); else n.topicos.push(novo);
    focoPendente = {nodeId, tid: novo.id};
  });
}

/* ================= seleção e exclusão ================= */
function selecionarSo(id, somar){
  if (somar){ if (sel.has(id)) sel.delete(id); else sel.add(id); }
  else if (!sel.has(id)){ sel.clear(); sel.add(id); }
  render(); renderPainel();
}
function contidos(g){
  const s = tam(g);
  return Q.nodes.filter(n => {
    if (n.id === g.id) return false;
    const t = tam(n);
    return n.x >= g.x && n.y >= g.y && n.x + t.w <= g.x + s.w && n.y + t.h <= g.y + s.h;
  });
}
function apagarQuadro(id){
  const q = quadros[id]; if (!q) return;
  q.nodes.forEach(m => {
    if (m.tipo === 'quadro' && m.quadroId && m.quadroId !== id) apagarQuadro(m.quadroId);
    (m.topicos || []).forEach(t => { if (t.quadroId && t.quadroId !== id) apagarQuadro(t.quadroId); });
  });
  delete quadros[id]; delete hist[id];
  agendarSalvar(id);
}
async function excluirSel(){
  if (ro() || !sel.size) return;
  const ns = Q.nodes.filter(n => sel.has(n.id));
  const qs = ns.filter(n => (n.tipo === 'quadro' && n.quadroId && quadros[n.quadroId] && quadros[n.quadroId].nodes.length) || (n.topicos || []).some(t => t.quadroId && quadros[t.quadroId]));
  if (qs.length){
    const ok = await confirmar({titulo: qs.length > 1 ? 'Excluir quadros?' : 'Excluir quadro?', texto: 'Tudo o que está dentro ' + (qs.length > 1 ? 'desses quadros' : 'desse quadro') + ' também vai ser apagado. Isso não pode ser desfeito.', ok: 'Excluir'});
    if (!ok) return;
  }
  const ids = new Set(ns.map(n => n.id));
  const selArestas = new Set([...sel].filter(id => aresta(id)));
  mutar(() => {
    Q.nodes = Q.nodes.filter(n => !ids.has(n.id));
    Q.edges = Q.edges.filter(a => !selArestas.has(a.id) && !ids.has(a.de) && !ids.has(a.para));
    ns.forEach(n => { if (n.tipo === 'quadro' && n.quadroId) apagarQuadro(n.quadroId); (n.topicos || []).forEach(t => { if (t.quadroId) apagarQuadro(t.quadroId); }); });
    ns.forEach(n => registrar('excluido', n, {txt: nomeNo(n), id: null}));
    sel.clear();
  });
}

/* ================= copiar / colar ================= */
function montarClip(ids){
  const nodes = Q.nodes.filter(n => ids.has(n.id));
  if (!nodes.length) return null;
  const nIds = new Set(nodes.map(n => n.id));
  const edges = Q.edges.filter(a => nIds.has(a.de) && nIds.has(a.para));
  const subs = {};
  const coletar = qid => {
    const q = quadros[qid]; if (!q || subs[qid]) return;
    subs[qid] = JSON.parse(corpoJSON(q));
    q.nodes.forEach(m => { if (m.tipo === 'quadro' && m.quadroId) coletar(m.quadroId); (m.topicos || []).forEach(t => { if (t.quadroId) coletar(t.quadroId); }); });
  };
  nodes.forEach(n => { if (n.tipo === 'quadro' && n.quadroId) coletar(n.quadroId); (n.topicos || []).forEach(t => { if (t.quadroId) coletar(t.quadroId); }); });
  return {formato: 'canvas-bl', versao: 1, nodes: clone(nodes), edges: clone(edges), quadros: subs};
}
function colarClip(c, alvo){
  if (!c || ro() || !Array.isArray(c.nodes) || !c.nodes.length) return;
  mutar(() => {
    const mapaQ = {};
    Object.keys(c.quadros || {}).forEach(q => { mapaQ[q] = uid('q'); });
    Object.keys(c.quadros || {}).forEach(old => {
      const nq = normalizar(clone(c.quadros[old]));
      nq.pai = mapaQ[nq.pai] || atualId;
      nq.nodes.forEach(m => { if (m.quadroId && mapaQ[m.quadroId]) m.quadroId = mapaQ[m.quadroId]; (m.topicos || []).forEach(t => { if (t.quadroId) { if (mapaQ[t.quadroId]) t.quadroId = mapaQ[t.quadroId]; else delete t.quadroId; } }); });
      quadros[mapaQ[old]] = nq;
      agendarSalvar(mapaQ[old]);
    });
    const minx = Math.min(...c.nodes.map(n => n.x)), miny = Math.min(...c.nodes.map(n => n.y));
    let ox = 30, oy = 30;
    if (alvo){ ox = alvo.x - minx; oy = alvo.y - miny; if (cfg.snapGrade){ ox = snapV(ox); oy = snapV(oy); } }
    const mapaN = {};
    sel.clear();
    c.nodes.forEach(n0 => {
      if (!TIPOS[n0.tipo]) return;
      const n = clone(n0);
      n.id = uid('n'); mapaN[n0.id] = n.id;
      n.x = (+n.x || 0) + ox; n.y = (+n.y || 0) + oy;
      (n.topicos || []).forEach(t => { t.id = uid('t'); if (t.quadroId){ if (mapaQ[t.quadroId]){ t.quadroId = mapaQ[t.quadroId]; quadros[t.quadroId].pai = atualId; } else delete t.quadroId; } });
      if (n.tipo === 'quadro'){
        if (n.quadroId && mapaQ[n.quadroId]) n.quadroId = mapaQ[n.quadroId];
        else { const qid = uid('q'); quadros[qid] = {nome: n.titulo || 'Quadro', pai: atualId, nodes: [], edges: []}; n.quadroId = qid; agendarSalvar(qid); }
      }
      if (n.tipo === 'grupo') Q.nodes.unshift(n); else Q.nodes.push(n);
      sel.add(n.id);
    });
    (c.edges || []).forEach(a0 => {
      const a = clone(a0);
      a.id = uid('a'); a.de = mapaN[a0.de]; a.para = mapaN[a0.para];
      if (a.de && a.para) Q.edges.push(a);
    });
  });
}
function duplicar(){
  const c = montarClip(new Set(sel)); if (!c) return;
  colarClip(c, null);
}
function pontoColar(){
  const r = vp.getBoundingClientRect();
  if (ultimoMouse.x > r.left && ultimoMouse.x < r.right && ultimoMouse.y > r.top && ultimoMouse.y < r.bottom) return mundoDe(ultimoMouse.x, ultimoMouse.y);
  const c = centroMundo(); return {x: c.x - 100, y: c.y - 60};
}
document.addEventListener('copy', e => {

document.addEventListener('cut', e => {

document.addEventListener('paste', e => {
  if (emCampo(e.target) || emCampo(document.activeElement) || !modal.hidden) return;
  if (ro()) return;
  e.preventDefault();
  const txt = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
  let c = null;
  try { const o = JSON.parse(txt); if (o && o.formato === 'canvas-bl') c = o; } catch(err){}
  const pt = pontoColar();
  if (c) colarClip(c, pt);
  else if (txt.trim()){
    mutar(() => {
      const n = novoNo('cartao', cfg.snapGrade ? snapV(pt.x) : pt.x, cfg.snapGrade ? snapV(pt.y) : pt.y);
      n.texto = txt.trim().slice(0, 5000);
      Q.nodes.push(n); sel.clear(); sel.add(n.id);
    });
  } else if (clipInterno) colarClip(clipInterno, pt);
  else toast('Não há nada pra colar.');
});

/* ================= alinhar / distribuir / agrupar / ordem ================= */
function alinhar(modo){
  const ns = Q.nodes.filter(n => sel.has(n.id)); if (ns.length < 2) return;
  mutar(() => {
    const L = limites(ns);
    ns.forEach(n => {
      const s = tam(n);
      if (modo === 'esq') n.x = L.x;
      if (modo === 'dir') n.x = L.x + L.w - s.w;
      if (modo === 'cx') n.x = Math.round(L.x + L.w / 2 - s.w / 2);
      if (modo === 'topo') n.y = L.y;
      if (modo === 'base') n.y = L.y + L.h - s.h;
      if (modo === 'cy') n.y = Math.round(L.y + L.h / 2 - s.h / 2);
    });
  });
}
function distribuir(eixo){
  const ns = Q.nodes.filter(n => sel.has(n.id)); if (ns.length < 3) return;
  mutar(() => {
    const k = eixo === 'h' ? 'x' : 'y', d = eixo === 'h' ? 'w' : 'h';
    ns.sort((a, b) => a[k] - b[k]);
    const total = ns.reduce((s, n) => s + tam(n)[d], 0);
    const ini = ns[0][k], fim = ns[ns.length - 1][k] + tam(ns[ns.length - 1])[d];
    const gap = (fim - ini - total) / (ns.length - 1);
    let cur = ini;
    ns.forEach(n => { n[k] = Math.round(cur); cur += tam(n)[d] + gap; });
  });
}
function agrupar(){
  const ns = Q.nodes.filter(n => sel.has(n.id)); if (!ns.length) return;
  mutar(() => {
    const L = limites(ns);
    const g = novoNo('grupo', snapV(L.x - 40), snapV(L.y - 40));
    g.w = snapV(L.w + 80); g.h = snapV(L.h + 80);
    Q.nodes.unshift(g);
    sel.clear(); sel.add(g.id);
    focoPendente = {nodeId: g.id, campo: 'titulo'};
  });
}
function ordem(frente){
  const ids = new Set(sel); if (!ids.size) return;
  mutar(() => {
    const a = Q.nodes.filter(n => ids.has(n.id)), b = Q.nodes.filter(n => !ids.has(n.id));
    Q.nodes = frente ? b.concat(a) : a.concat(b);
  });
}
function mudarCor(ids, cor){
  mutar(() => { ids.forEach(id => { const n = no(id) || aresta(id); if (n) n.cor = cor; }); });
}
function converter(n, tipo){
  if (n.tipo === tipo) return;
  mutar(() => {
    const t = TIPOS[tipo];
    if (TIPOS[n.tipo].estruturado && t.estruturado){ if (n.cor === TIPOS[n.tipo].cor) n.cor = t.cor; n.tipo = tipo; }
  });
}

const toques = new Map();

let pinca = null, timerLongo = 0, longoDisparou = false;
function cancelarLongo(){ clearTimeout(timerLongo); timerLongo = 0; }

vp.addEventListener('pointerdown', e => {
  fecharMenu();
  if (!pop.hidden && !pop.contains(e.target)) fecharPop();
  if (e.pointerType === 'touch'){
    toques.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (toques.size === 2){ cancelarLongo(); if (acao && acao.cancelar) acao.cancelar(); acao = null; iniciarPinca(); return; }
    if (toques.size > 2) return;
    longoDisparou = false;
    const x0 = e.clientX, y0 = e.clientY, alvo = e.target;
    cancelarLongo();
    timerLongo = setTimeout(() => {
      timerLongo = 0;
      const t = toques.get(e.pointerId);
      if (!t || Math.hypot(t.x - x0, t.y - y0) > 10) return;
      if (acao && acao.cancelar) acao.cancelar();
      acao = null; longoDisparou = true;
      abrirContexto(x0, y0, alvo);
    }, 520);
  }
  if (e.button === 1){ e.preventDefault(); iniciarPan(e, false); return; }
  if (e.button !== 0) return;
  const t = e.target;
  if (editando && editando.el.contains(t)) return;
  if (editando) encerrarEdicao(true);
  if (!emCampo(t)) vp.focus({preventScroll: true});

  const noEl = t.closest('.no');
  if (t.closest('.alca') && noEl){ if (!ro()) iniciarConexao(e, noEl.dataset.id, t.closest('.alca').dataset.lado); return; }

  if (t.closest('[data-acao]')){ if (noEl && !sel.has(noEl.dataset.id)) selecionarSo(noEl.dataset.id, false); return; }
  if (noEl){ iniciarArrasto(e, noEl.dataset.id); return; }
  const ar = t.closest('[data-aresta]');
  if (ar){ selecionarSo(ar.dataset.aresta, e.shiftKey); return; }
  if (e.shiftKey || (cfg.modoSel && !espaco)) iniciarCaixa(e); else iniciarPan(e, true);
});
window.addEventListener('pointermove', e => {

function fimPonteiro(e){
  if (e.pointerType === 'touch'){ toques.delete(e.pointerId); if (toques.size < 2) pinca = null; }
  cancelarLongo();
  if (acao){ const a = acao; acao = null; a.soltar(e); setTimeout(aplicarRemotoPendente, 0); }
}

function iniciarPinca(){
  const [a, b] = [...toques.values()];
  pinca = {d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: view.k, c0: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}, vx: view.x, vy: view.y};
}
function moverPinca(){
  const [a, b] = [...toques.values()];
  const d = Math.hypot(a.x - b.x, a.y - b.y), c = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  const r = vp.getBoundingClientRect();
  const nk = clamp(pinca.k0 * d / pinca.d0, 0.08, 4);
  const px = pinca.c0.x - r.left, py = pinca.c0.y - r.top;
  view.k = nk;
  view.x = px - (px - pinca.vx) * (nk / pinca.k0) + (c.x - pinca.c0.x);
  view.y = py - (py - pinca.vy) * (nk / pinca.k0) + (c.y - pinca.c0.y);
  aplicarView();
}
function iniciarPan(e, limparAoClicar){
  const x0 = e.clientX, y0 = e.clientY;
  let ux = x0, uy = y0, moveu = false;
  acao = {
    mover(ev){
      if (!moveu && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 3) return;
      if (!moveu){ moveu = true; vp.classList.add('panning'); }
      view.x += ev.clientX - ux; view.y += ev.clientY - uy; ux = ev.clientX; uy = ev.clientY; aplicarView();
    },
    soltar(){
      vp.classList.remove('panning');
      if (!moveu && limparAoClicar && !longoDisparou && sel.size){ sel.clear(); render(); renderPainel(); }
    },
    cancelar(){ vp.classList.remove('panning'); }
  };
}
function iniciarCaixa(e){
  const caixa = document.createElement('div'); caixa.id = 'selecao-caixa'; document.body.appendChild(caixa);
  const x0 = e.clientX, y0 = e.clientY, base = new Set(sel);
  const upd = ev => {
    const x = Math.min(x0, ev.clientX), y = Math.min(y0, ev.clientY), w = Math.abs(ev.clientX - x0), h = Math.abs(ev.clientY - y0);
    Object.assign(caixa.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
    const a = mundoDe(x, y), b = mundoDe(x + w, y + h);
    sel = new Set(base);
    Q.nodes.forEach(n => { const s = tam(n); if (n.x < b.x && n.x + s.w > a.x && n.y < b.y && n.y + s.h > a.y) sel.add(n.id); });
    for (const [id, el] of elsNo) el.classList.toggle('sel', sel.has(id));
    atualizarCaixaSel();
  };
  let andou = false;
  const mover = ev => { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 3) andou = true; upd(ev); };
  acao = {mover, soltar(){ caixa.remove(); if (!andou && !e.shiftKey) sel.clear(); render(); renderPainel(); }, cancelar(){ caixa.remove(); }};
}
function encaixeObjetos(n, nx, ny, excluir){
  const s = tam(n), tol = 8 / view.k;
  let bx = null, by = null, gx = null, gy = null, dx = tol, dy = tol;
  const mx = [0, s.w / 2, s.w], my = [0, s.h / 2, s.h];
  Q.nodes.forEach(o => {
    if (excluir.has(o.id)) return;
    const t = tam(o);
    [o.x, o.x + t.w / 2, o.x + t.w].forEach(c => mx.forEach(m => { const d = c - (nx + m); if (Math.abs(d) < Math.abs(dx)){ dx = d; bx = nx + d; gx = c; } }));
    [o.y, o.y + t.h / 2, o.y + t.h].forEach(c => my.forEach(m => { const d = c - (ny + m); if (Math.abs(d) < Math.abs(dy)){ dy = d; by = ny + d; gy = c; } }));
  });
  return {x: bx, y: by, gx, gy};
}
function desenharGuias(gx, gy){
  const a = mundoDe(0, 0), b = mundoDe(innerWidth, innerHeight);
  let h = '';
  if (gx != null) h += '<line class="guia" x1="' + gx + '" y1="' + a.y + '" x2="' + gx + '" y2="' + b.y + '"/>';
  if (gy != null) h += '<line class="guia" x1="' + a.x + '" y1="' + gy + '" x2="' + b.x + '" y2="' + gy + '"/>';
  gGuias.innerHTML = h;
}
function iniciarArrasto(e, id, pelaMoldura){
  const n = no(id); if (!n) return;
  if (e.shiftKey && !pelaMoldura){ selecionarSo(id, true); return; }
  if (!sel.has(id)){ sel.clear(); sel.add(id); render(); renderPainel(); }
  if (ro()) return;
  const p0 = mundoDe(e.clientX, e.clientY);
  const mover = new Set();
  sel.forEach(sid => {
    const m = no(sid); if (!m) return;
    mover.add(sid);
    if (m.tipo === 'grupo') contidos(m).forEach(c => mover.add(c.id));
  });
  const orig = new Map();
  mover.forEach(mid => { const m = no(mid); orig.set(mid, {x: m.x, y: m.y}); });
  let moveu = false;
  acao = {
    mover(ev){
      const p = mundoDe(ev.clientX, ev.clientY);
      let dx = p.x - p0.x, dy = p.y - p0.y;
      if (!moveu && Math.hypot(dx * view.k, dy * view.k) < 3) return;
      if (!moveu){ moveu = true; antes(); document.body.classList.add('arrastando'); }
      let travaX = false, travaY = false;
      if (ev.shiftKey){ if (Math.abs(dx) > Math.abs(dy)){ dy = 0; travaY = true; } else { dx = 0; travaX = true; } }
      const o = orig.get(id);
      let nx = o.x + dx, ny = o.y + dy, gx = null, gy = null;
      if (!espaco){
        let r = {x: null, y: null};
        if (cfg.snapObj) r = encaixeObjetos(n, nx, ny, mover);
        if (!travaX){ if (r.x != null){ nx = r.x; gx = r.gx; } else if (cfg.snapGrade) nx = snapV(nx); }
        if (!travaY){ if (r.y != null){ ny = r.y; gy = r.gy; } else if (cfg.snapGrade) ny = snapV(ny); }
      }
      dx = nx - o.x; dy = ny - o.y;
      mover.forEach(mid => { const m = no(mid), q = orig.get(mid); if (!m) return; m.x = q.x + dx; m.y = q.y + dy; const el = elsNo.get(mid); if (el) posicionar(el, m); });
      desenharGuias(gx, gy);
      renderArestas();
      atualizarCaixaSel();
      agendarMini();
    },
    soltar(){
      document.body.classList.remove('arrastando');
      gGuias.innerHTML = '';
      if (moveu){ agendarSalvar(atualId); render(); }
    },
    cancelar(){
      document.body.classList.remove('arrastando'); gGuias.innerHTML = '';
      if (moveu){ mover.forEach(mid => { const m = no(mid), q = orig.get(mid); if (m){ m.x = q.x; m.y = q.y; } }); histDe(atualId).undo.pop(); render(); }
    }
  };
}
function iniciarRedim(e, id){
  const n = no(id); if (!n) return;
  if (!sel.has(id)){ sel.clear(); sel.add(id); render(); renderPainel(); }
  const p0 = mundoDe(e.clientX, e.clientY);
  const s0 = tam(n), w0 = n.w, h0 = n.h || s0.h;
  const soLargura = !(n.tipo === 'cartao' || n.tipo === 'grupo' || n.tipo === 'painel');
  let moveu = false;
  acao = {
    mover(ev){
      const p = mundoDe(ev.clientX, ev.clientY);
      if (!moveu){ moveu = true; antes(); }
      let w = Math.max(n.tipo === 'texto' ? 60 : 140, w0 + p.x - p0.x);
      let h = Math.max(n.tipo === 'grupo' ? 120 : 60, h0 + p.y - p0.y);
      if (ev.shiftKey && !soLargura){ const r = h0 / w0; h = w * r; }
      if (cfg.snapGrade && !espaco && !ev.shiftKey){ w = Math.max(GRADE * 3, snapV(n.x + w) - n.x); h = Math.max(GRADE * 3, snapV(n.y + h) - n.y); }
      n.w = Math.round(w);
      if (!soLargura) n.h = Math.round(h);
      const el = elsNo.get(id); if (el) posicionar(el, n);
      renderArestas();
    },
    soltar(){ if (moveu){ agendarSalvar(atualId); render(); renderPainel(true); } },
    cancelar(){ if (moveu){ n.w = w0; if (!soLargura) n.h = h0; histDe(atualId).undo.pop(); render(); } }
  };

function ladoProximo(n, p){
  let melhor = 'l', md = Infinity;
  ['t','r','b','l'].forEach(l => { const q = pontoLado(n, l), d = Math.hypot(q.x - p.x, q.y - p.y); if (d < md){ md = d; melhor = l; } });
  return melhor;
}
function iniciarConexao(e, id, lado){
  const n = no(id); if (!n) return;
  const p1 = pontoLado(n, lado);
  document.body.classList.add('conectando');
  let alvoEl = null, andou = 0;
  const x0 = e.clientX, y0 = e.clientY;
  const limpar = () => { gTemp.innerHTML = ''; document.body.classList.remove('conectando'); if (alvoEl) alvoEl.classList.remove('alvo'); };
  acao = {
    mover(ev){
      andou = Math.max(andou, Math.hypot(ev.clientX - x0, ev.clientY - y0));
      const p = mundoDe(ev.clientX, ev.clientY);
      const baixo = document.elementFromPoint(ev.clientX, ev.clientY);
      const cand = baixo && baixo.closest ? baixo.closest('.no') : null;
      if (alvoEl && alvoEl !== cand) alvoEl.classList.remove('alvo');
      alvoEl = cand && cand.dataset.id !== id ? cand : null;
      if (alvoEl) alvoEl.classList.add('alvo');
      let p2 = p, l2 = opostos[lado];
      if (alvoEl){ const m = no(alvoEl.dataset.id); if (m){ l2 = ladoProximo(m, p); p2 = pontoLado(m, l2); } }
      else { const dx = p.x - p1.x, dy = p.y - p1.y; l2 = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'l' : 'r') : (dy > 0 ? 't' : 'b'); }
      gTemp.innerHTML = '<path class="temp" d="' + caminho(cfg.estiloLinha, lado, l2, p1, p2).d + '"/>';
    },
    soltar(ev){
      const alvo = alvoEl ? no(alvoEl.dataset.id) : null;
      limpar();
      const p = mundoDe(ev.clientX, ev.clientY);
      if (alvo){
        const l2 = ladoProximo(alvo, p);
        mutar(() => {
          const a = Object.assign({id: uid('a'), de: id, deLado: lado, para: alvo.id, paraLado: l2}, arestaPadrao());
          Q.edges.push(a); sel.clear(); sel.add(a.id);
        });
      } else if (andou > 24){
        menuCanvas(ev.clientX, ev.clientY, p, {id, lado});
      }
    },
    cancelar: limpar
  };
}

function fecharMenu(){ if (!menu.hidden){ menu.hidden = true; menu.innerHTML = ''; } }
function abrirMenu(cx, cy, itens){
  menu.innerHTML = '';
  itens.forEach(it => {
    if (!it) return;
    if (it.sep){ const d = document.createElement('div'); d.className = 'm-sep'; menu.appendChild(d); return; }
    if (it.secao){ const d = document.createElement('div'); d.className = 'm-sec'; d.textContent = it.secao; menu.appendChild(d); return; }
    if (it.cores){
      const d = document.createElement('div'); d.className = 'm-cores';
      CORES.forEach(c => {
        const b = document.createElement('button');
        b.className = 'cor-b' + (it.atual === c.id ? ' ativo' : '');
        b.style.setProperty('--c', c.hex); b.dataset.cor = c.id; b.title = c.nome; b.setAttribute('aria-label', c.nome);
        b.addEventListener('click', () => { fecharMenu(); it.acao(c.id); });
        d.appendChild(b);
      });
      menu.appendChild(d); return;
    }
    if (it.segmento){
      const d = document.createElement('div'); d.className = 'm-seg';
      d.innerHTML = '<span>' + esc(it.rotulo) + '</span>';
      const s = document.createElement('div'); s.className = 'seg';
      it.opcoes.forEach(o => {
        const b = document.createElement('button'); b.textContent = o.rotulo;
        if (o.v === it.atual) b.className = 'ativo';
        b.addEventListener('click', () => { fecharMenu(); it.acao(o.v); });
        s.appendChild(b);
      });
      d.appendChild(s); menu.appendChild(d); return;
    }
    const b = document.createElement('button');
    b.className = 'mi' + (it.perigo ? ' perigo' : '');
    b.setAttribute('role', 'menuitem');
    b.disabled = !!it.desativado;
    const icone = it.marcado !== undefined ? (it.marcado ? ico('check') : '') : ico(it.icone || '');
    b.innerHTML = '<span class="mi-ico">' + icone + '</span><span class="mi-txt">' + esc(it.rotulo) + '</span>' + (it.atalho ? '<span class="mi-kbd">' + esc(it.atalho) + '</span>' : '');
    b.addEventListener('click', () => { fecharMenu(); it.acao(); });
    menu.appendChild(b);
  });
  menu.hidden = false;
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = clamp(cx, 8, innerWidth - w - 8) + 'px';
  menu.style.top = clamp(cy, 8, Math.max(8, innerHeight - h - 8)) + 'px';
  const primeiro = menu.querySelector('button:not(:disabled)');
  if (primeiro) primeiro.focus({preventScroll: true});
}

async function limparQuadro(){

/* ================= modal, atalhos, toast ================= */
function confirmar(o){
  return new Promise(res => {
    modal.innerHTML = '<div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="md-t"><h2 id="md-t">' + esc(o.titulo) + '</h2><p>' + esc(o.texto) + '</p>' +
      '<div class="modal-acoes"><button class="b" id="md-nao">Cancelar</button><button class="b ' + (o.perigo === false ? 'primario' : 'perigo') + '" id="md-sim">' + esc(o.ok || 'Confirmar') + '</button></div></div>';
    modal.hidden = false;
    const fim = v => { modal.hidden = true; modal.innerHTML = ''; document.removeEventListener('keydown', kd, true); res(v); vp.focus(); };
    const kd = e => { if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); fim(false); } else if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); fim(true); } };
    document.addEventListener('keydown', kd, true);
    $('#md-nao').addEventListener('click', () => fim(false));
    $('#md-sim').addEventListener('click', () => fim(true));
    modal.addEventListener('pointerdown', function fora(e){ if (e.target === modal){ modal.removeEventListener('pointerdown', fora); fim(false); } });
    $('#md-sim').focus();
  });
}
function mostrarAtalhos(){
  const L = [
    ['Botão direito', 'Menu de criar e configurar'], ['Dois cliques no fundo', 'Cria um cartão de texto'], ['Dois cliques num texto', 'Edita no próprio card'],
    ['Enter num tópico', 'Cria o próximo tópico'], ['Backspace em tópico vazio', 'Apaga o tópico'], ['Arrastar a bolinha da borda', 'Liga dois cards (solte no vazio pra criar um card já ligado)'],
    ['Arrastar o fundo', 'Move o canvas'], ['Roda do mouse', 'Move o canvas (Shift: na horizontal)'], ['Ctrl + roda, ou botão esquerdo segurado + roda', 'Zoom (aproxima e afasta)'], ['Shift + arrastar no fundo', 'Seleciona vários'], ['S (ou o botão de seta)', 'Liga e desliga o Selecionar área'], ['Arrastar a moldura da seleção', 'Move tudo o que está selecionado'], ['Espaço + arrastar', 'Move o canvas com o Selecionar área ligado'],
    ['Shift + clique', 'Soma ou tira da seleção'], ['Espaço segurado', 'Arrasta sem encaixar'], ['Shift segurado ao arrastar', 'Trava num eixo'],
    ['Ctrl + Z / Ctrl + Shift + Z', 'Desfazer / refazer'], ['Ctrl + C / X / V', 'Copiar / recortar / colar'], ['Ctrl + D', 'Duplicar'], ['Ctrl + F', 'Buscar card; Enter ou ↓ vai pro próximo, Shift + Enter ou ↑ volta'], ['Caixinha do tópico', 'Muda o status: A fazer, Em andamento, Concluído'], ['Ícone de camadas no tópico', 'Abre o canvas de anotações do tópico'], ['Ctrl + A', 'Selecionar tudo'],
    ['Delete', 'Excluir seleção'], ['Setas', 'Move a seleção (Shift: 20 px)'], ['F2', 'Editar título'], ['Shift + 1', 'Enquadrar tudo'], ['Esc', 'Limpa a seleção']
  ];
  modal.innerHTML = '<div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="md-t"><h2 id="md-t">Atalhos</h2><dl class="atalhos">' + L.map(([a, b]) => '<dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd>').join('') + '</dl><div class="modal-acoes"><button class="b primario" id="md-ok">Fechar</button></div></div>';
  modal.hidden = false;
  const fim = () => { modal.hidden = true; modal.innerHTML = ''; document.removeEventListener('keydown', kd, true); vp.focus(); };
  const kd = e => { if (e.key === 'Escape' || e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); fim(); } };

  $('#md-ok').addEventListener('click', fim);
  modal.addEventListener('pointerdown', function fora(e){ if (e.target === modal){ modal.removeEventListener('pointerdown', fora); fim(); } });
}
let timerToast = 0;

  const t = $('#toast'); t.textContent = msg; t.hidden = false;
